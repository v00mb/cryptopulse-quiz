<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CryptoPulse: find your crypto monitoring setup</title>
  <meta name="description" content="Answer 7 quick questions and get a crypto monitoring setup that fits you, delivered as Telegram alerts. No exchange login, no API keys.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <script type="module" src="/src/main.ts"></script>
</head>
<body class="notes-on">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7"/><polyline points="4,15 9,15 11.5,9 15,20.5 17.5,12 19.5,15 24,15" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>CryptoPulse</span>
      </a>
      <span class="badge">Concept · test task</span>
      <div class="bar-right">
        <label class="notes-toggle" for="notes-switch">
          <input type="checkbox" id="notes-switch" role="switch" checked>
          <span class="lbl-long">Reviewer notes</span><span class="lbl-short">Notes</span>
        </label>
      </div>
    </div>
  </header>

  <main>
    <section class="view-proto">
      <div class="wrap proto">
        <div class="stage" id="stage"></div>
        <aside class="notes" id="notes" aria-label="Reviewer notes"></aside>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <span>CryptoPulse is a concept made for a test task. Prices come from the public Binance spot market.</span>
      <span>Market data and alerts only. Not financial advice.</span>
    </div>
  </footer>
</body>
</html>
